<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snake game</title>

    <script
      defer
      src="https://pro.fontawesome.com/releases/v5.10.0/js/all.js"
      integrity="sha384-G/ZR3ntz68JZrH4pfPJyRbjW+c0+ojii5f+GYiYwldYU69A+Ejat6yIfLSxljXxD"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container noselect">
      <div class="wrapper">
        <div class="controls-left">
          <button id="replay">
            <i class="fas fa-play"></i>
            RESTART
          </button>
          <button id="playPause">
            <i class="fas fa-pause"></i>
            PAUSE
          </button>
        </div>
        <div id="canvas"></div>
        <div id="ui">
          <h2>SCORE</h2>
          <span id="score">00</span>
        </div>
      </div>

      <div class="difficulty-panel">
        <button class="difficulty-btn" data-level="easy">EASY</button>
        <button class="difficulty-btn active" data-level="medium">MEDIUM</button>
        <button class="difficulty-btn" data-level="hard">HARD</button>
      </div>
      <div id="difficulty-indicator">LEVEL: MEDIUM</div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
